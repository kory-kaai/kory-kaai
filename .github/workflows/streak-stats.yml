name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download streak SVG
        run: |
          mkdir -p output
          curl -fsSL \
            "https://github-readme-streak-stats-eight.vercel.app/?user=kory-kaai&theme=radical&hide_border=true&disable_animations=true" \
            -o output/streak.svg
          if grep -q "Failed to retrieve" output/streak.svg; then
            echo "streak provider returned an error page"
            exit 1
          fi

      - uses: EndBug/add-and-commit@v9
        with:
          author_name: kory-kaai
          author_email: 69431357+kory-kaai@users.noreply.github.com
          message: chore: update streak stats svg
          add: output/streak.svg
